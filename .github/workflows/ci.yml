name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        env:
          # The CI gate only builds (tsc) and runs unit tests; it never launches
          # Electron. Skip the platform-binary download to keep CI fast and
          # avoid unrelated post-install flakiness. TypeScript types are still
          # installed, so the build resolves Electron imports.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm ci

      - name: Build and test
        run: npm test
